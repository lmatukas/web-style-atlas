name: Regenerate canonical previews
# Manual only. Renders PNG previews in the canonical environment (Ubuntu 24.04,
# Node 24.19.0, locked Playwright Chromium headless shell) and commits them to
# the given same-repository branch. Commits made with GITHUB_TOKEN do not start
# other workflows, so run "Atlas validation" on the branch afterwards.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Same-repository branch to update (never main)'
        required: true
        type: string
      style:
        description: 'One style id, or empty to regenerate all styles'
        required: false
        type: string
        default: ''
permissions:
  contents: write
concurrency:
  group: previews-${{ inputs.branch }}
  cancel-in-progress: false
jobs:
  regenerate:
    name: Render and commit previews
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BRANCH: ${{ inputs.branch }}
      STYLE: ${{ inputs.style }}
    steps:
      - name: Refuse protected or empty branch names
        run: |
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "main" ]; then
            echo "Refusing to write to branch: '$BRANCH'" >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install only the locked Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium
      - name: Render previews and verify them
        run: |
          npm run build
          if [ -n "$STYLE" ]; then
            npm run previews -- --style "$STYLE"
          else
            npm run previews -- --all
          fi
          npm run build
          if [ -n "$STYLE" ]; then
            npm run check -- --style "$STYLE"
          else
            npm run check
          fi
      - name: Commit regenerated previews to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- styles catalog
          if git diff --cached --quiet; then
            echo "No preview bytes changed; nothing to commit."
            exit 0
          fi
          git commit -m "chore: regenerate canonical previews${STYLE:+ for $STYLE}"
          git push origin "HEAD:refs/heads/$BRANCH"
