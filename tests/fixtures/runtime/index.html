<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D ir garso bandinys</title><style>body{margin:0;background:#f1eadc;color:#162c3b;font:20px/1.5 sans-serif}main{max-width:900px;margin:auto;padding:24px}canvas,svg{display:block;width:100%;height:300px}button{font:inherit;padding:12px;margin:6px;background:#162c3b;color:#fff;border:2px solid #162c3b}:focus-visible{outline:3px solid #a34c20;outline-offset:3px}[hidden]{display:none!important}.spacer{height:1400px}</style></head><body><main><h1>Vario objekto bandinys</h1><p>Originalus trimatis gretasienis. Valdymas ir objekto informacija prieinami įprastame HTML.</p><section id="scene" data-runtime-scene><canvas width="640" height="300" aria-label="Apšviestas trimatis vario objektas"></canvas><svg data-runtime-fallback hidden viewBox="0 0 640 300" aria-label="Statinis vario objekto pakaitalas"><path d="M180 90 400 50 460 210 240 250Z" fill="#9d5238"/><path d="M180 90 240 250 240 100Z" fill="#5e3025"/></svg></section><p data-runtime-status role="status"></p><button data-motion-toggle>Pristabdyti judesį</button><button id="color">Keisti apdailą</button><p id="choice">Apdaila: varis</p><button data-audio-start>Įjungti garsą</button><button data-audio-pause>Pristabdyti garsą</button><button data-audio-mute aria-pressed="false">Nutildyti</button><p data-audio-status role="status">Garsas išjungtas</p><div class="spacer"></div><footer>Demonstracinis bandinys; autorinis kodas, MIT. Ne užsakymo sistema.</footer></main><script type="module" src="scene.mjs"></script></body></html>
